<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JustMarkets Partners | Bersama Akademi Hafizzat Rusli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- === GANTI KUNCI KESELAMATAN ANDA NANTI SETELAH SIAP ALAMAT === -->
  <script src="https://www.google.com/recaptcha/api.js?render=GANTI_KUNCI_RECAPTCHA_ANDA_DI_SINI"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif;}
    body {background:#ffffff; color:#111; padding:2rem 1.5rem; line-height:1.6;}

    .logo-teks {font-size:2.2rem; font-weight:700; color:#2563eb; text-align:center;}
    .sub-logo {font-size:1rem; text-align:center; letter-spacing:2px; margin-bottom:3rem;}
    h1 {font-size:1.8rem; font-weight:600; margin-bottom:2.5rem; text-align:left;}

    label {display:block; margin-bottom:0.7rem; font-weight:500; font-size:1rem;}
    .kotak-masuk {width:100%; padding:1rem 1.2rem; font-size:1rem; border:1px solid #d1d5db; border-radius:0.5rem; margin-bottom:1.5rem;}
    .kotak-masuk:focus {outline:none; border-color:#2563eb;}

    .tombol-biru {width:100%; padding:1rem; background-color:#2563eb; color:white; border:none; border-radius:0.5rem; font-size:1.05rem; font-weight:500; margin-bottom:2rem;}
    .tombol-biru:disabled {background-color:#93c5fd; cursor:not-allowed;}

    .garis-pemisah {display:flex; align-items:center; justify-content:center; gap:1rem; margin-bottom:2rem; color:#6b7280;}
    .garis-pemisah::before,.garis-pemisah::after {content:""; height:1px; background:#e5e7eb; flex:1;}

    .tombol-google {display:flex; align-items:center; justify-content:center; gap:0.7rem; width:100%; padding:0.9rem; border:1px solid #d1d5db; border-radius:0.5rem; background:white; font-size:1rem; font-weight:500; margin-bottom:2rem;}
    .tombol-google img {height:22px; width:auto;}

    .teks-tengah {text-align:center; font-size:1rem; margin-bottom:1.5rem; color:#444;}
    .pautan-biru {color:#2563eb; text-decoration:none; font-weight:500;}
    .pautan-biru:hover {text-decoration:underline;}

    .teks-perjanjian {font-size:0.9rem; color:#555; text-align:center; line-height:1.5; margin-bottom:3rem;}
    .bahasa-tengah {text-align:center; font-size:0.9rem; color:#666;}
  </style>
</head>
<body>
  <main>
    <div class="logo-teks">JustMarkets</div>
    <div class="sub-logo">PARTNERS</div>
    <h1>Selamat datang di JustMarkets Partners</h1>

    <form id="borangDaftar" action="/daftar-mitra" method="post">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" class="kotak-masuk" placeholder="Masukkan alamat email Anda" required>

      <button type="submit" id="btnUtama" class="tombol-biru" disabled>Berikutnya</button>

      <div class="garis-pemisah">atau</div>

      <a href="/masuk-google?asal=daftar&bahasa=ms" class="tombol-google">
        <img src="https://www.gstatic.com/images/branding/googlelogo/svg/googlelogo_clr_74x24px.svg" alt="Logo Google">
        Lanjutkan dengan Google
      </a>

      <p class="teks-tengah">Punya akun? <a href="#" class="pautan-biru">Masuk</a></p>

      <p class="teks-perjanjian">Dengan mengklik Berikutnya, saya menyetujui <a href="#" class="pautan-biru">Ketentuan Layanan</a> dan <a href="#" class="pautan-biru">Kebijakan Privasi JustMarkets</a></p>

      <!-- === NANTI GANTI KUNCI CLOUDFLARE ANDA DI SINI === -->
      <div class="cf-turnstile" data-sitekey="GANTI_KUNCI_CLOUDFLARE_ANDA_DI_SINI"></div>
    </form>

    <p class="bahasa-tengah">🌐 Bahasa Melayu</p>
  </main>

  <script>
    // Aktifkan tombol Biru segera setelah email tertulis benar
    const inputEmail = document.getElementById('email');
    const tombolUtama = document.getElementById('btnUtama');
    const syaratEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    inputEmail.addEventListener('input', function(){
      if(syaratEmail.test(this.value.trim())){
        tombolUtama.removeAttribute('disabled');
      } else {
        tombolUtama.setAttribute('disabled','disabled');
      }
    });
  </script>
</body>
</html>
